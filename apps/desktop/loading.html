<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nexo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .tarjeta {
    max-width: 360px;
    text-align: center;
  }
  .icono {
    width: 72px;
    height: 72px;
    margin: 0 auto 22px;
  }
  .icono img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  h1 {
    font-size: 19px;
    margin: 0 0 8px;
    font-weight: 700;
    letter-spacing: .01em;
  }
  p {
    margin: 0 0 26px;
    font-size: 13.5px;
    line-height: 1.5;
    color: #94a3b8;
  }
  .spinner {
    width: 26px;
    height: 26px;
    margin: 0 auto;
    border-radius: 50%;
    border: 3px solid rgba(148, 163, 184, .25);
    border-top-color: #2563ff;
    animation: girar .8s linear infinite;
  }
  @keyframes girar {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="icono"><img src="build/icon.ico" alt="Nexo"></div>
    <h1>Nexo</h1>
    <p>Cargando tu negocio...</p>
    <div class="spinner" role="status" aria-label="Cargando"></div>
  </div>
</body>
</html>
